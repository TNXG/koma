name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hap:
    # ubuntu-26.04 只提供 libxml2-16（soname libxml2.so.16），而 Kotlin/Native 预编译的
    # ld.lld 硬链接 libxml2.so.2，链接 libkn.so 时直接加载失败。24.04 仍是 libxml2 2.9。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 社区镜像（kgbook/HarmonyOSCommandLineTools）提供 6.x linux-x64 CLT：
      # 华为云官方镜像只到 5.1.0，官网 6.x 无稳定直链。哈希 pin 自 release 页声明。
      - name: Fetch HarmonyOS command line tools
        run: |
          set -euo pipefail
          clt="$RUNNER_TEMP/clt.tar.gz"
          curl -fL --retry 3 -o "$clt" \
            https://github.com/kgbook/HarmonyOSCommandLineTools/releases/download/6.1.1.280/command-line-tools.tar.gz
          echo "7c5dca0221b1fde7e2396bc00e18c791b9c1c50eb1756943fe3881429554f3fe  $clt" | sha256sum -c -
          mkdir -p .tools/ohos
          tar -xzf "$clt" -C .tools/ohos
          rm -f "$clt"
          # tar 布局是 command-line-tools/...；setup 脚本按相对布局工作
          ls .tools/ohos/command-line-tools

      - name: Repair toolchain permissions
        run: tools/setup-harmony.sh

      - name: Fetch OCR model
        run: tools/fetch-ocr-model.sh

      # publishDebugBinariesToHarmonyApp：K/N 交叉编译 libkn.so 并连同 compose 资源、OCR 模型发布进壳工程
      - name: Publish Kotlin/Native binaries
        working-directory: harmonySpike
        run: sh gradlew publishDebugBinariesToHarmonyApp --no-daemon

      - name: Install ArkTS dependencies
        working-directory: harmonySpike/harmonyApp
        env:
          HOS_CLT: ${{ github.workspace }}/.tools/ohos/command-line-tools
        run: |
          export PATH="$HOS_CLT/bin:$PATH"
          ohpm install --all

      # 工程级 build-profile.json5 是 machine-local 文件（含 DevEco 自动签名路径，已 gitignore）。
      # 从 secret 还原本地配置与签名材料，脚本再把材料路径重指到临时目录、抹掉本机 SDK 版本，
      # 产出与工具链一致的可安装 signed HAP；模块级 entry/build-profile.json5 走仓库版本。
      - name: Restore HAP build profile and signing materials
        env:
          HAP_BUILD_PROFILE_BASE64: ${{ secrets.HAP_BUILD_PROFILE_BASE64 }}
          HAP_SIGNING_MATERIALS_BASE64: ${{ secrets.HAP_SIGNING_MATERIALS_BASE64 }}
        run: |
          set -euo pipefail
          materials="$RUNNER_TEMP/hap-signing"
          mkdir -p "$materials"
          printf '%s' "$HAP_SIGNING_MATERIALS_BASE64" | base64 -d | tar -xz -C "$materials"
          profile=harmonySpike/harmonyApp/build-profile.json5
          printf '%s' "$HAP_BUILD_PROFILE_BASE64" | base64 -d > "$profile"
          python3 tools/prepare-hap-profile.py "$profile" "$materials"

      - name: Assemble HAP
        working-directory: harmonySpike/harmonyApp
        env:
          HOS_CLT: ${{ github.workspace }}/.tools/ohos/command-line-tools
          DEVECO_SDK_HOME: ${{ github.workspace }}/.tools/ohos/command-line-tools/sdk
        run: |
          export PATH="$HOS_CLT/bin:$HOS_CLT/tool/node/bin:$PATH"
          export DEVECO_NODE_HOME="$HOS_CLT/tool/node"
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
          ls -l entry/build/default/outputs/default/*.hap

      - uses: actions/upload-artifact@v4
        with:
          name: koma-hap
          path: harmonySpike/harmonyApp/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      # The runner image already ships the SDK; android-actions/setup-android fails on newer
      # cmdline-tools because it insists on the removed `tools` package.
      - name: Install SDK packages
        run: |
          set -euo pipefail
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # captcha.onnx is gitignored; fetch it by pinned checksum instead of committing 13 MB.
      - name: Fetch OCR model
        run: tools/fetch-ocr-model.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KOMA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/koma.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/koma.p12"

      # One Gradle run produces every ABI split plus the universal APK.
      - name: Build signed APKs
        env:
          KOMA_KEYSTORE: ${{ runner.temp }}/koma.p12
          KOMA_KEYSTORE_PASSWORD: ${{ secrets.KOMA_KEYSTORE_PASSWORD }}
          KOMA_KEY_PASSWORD: ${{ secrets.KOMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --console=plain
          ls -l app/build/outputs/apk/release/*.apk

      - name: Verify splits, model and signature
        run: |
          set -euo pipefail
          python3 tools/verify-apks.py
          for apk in app/build/outputs/apk/release/Koma-*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            echo "signed: $apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: koma-apks
          path: app/build/outputs/apk/release/Koma-*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [hap, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: koma-apks
          path: dist/apk

      - uses: actions/download-artifact@v4
        with:
          name: koma-hap
          path: dist/hap

      # 重打同一个 tag 时 release 已存在（删 tag 会让它变成 draft）：覆盖资产而不是失败，
      # 保留既有说明后显式发布，避免留下 draft。HAP 按 APK 的命名习惯改名为
      # Koma-<版本>-ohos-<架构>.hap 再上传。
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cp dist/hap/entry-default-signed.hap "dist/hap/Koma-${version}-ohos-arm64-v8a.hap"
          assets=(dist/apk/Koma-*.apk dist/hap/Koma-*.hap)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # 旧命名的 koma-*.apk 会在改名后残留，先删掉，release 里只保留 Koma- 资产。
            for stale in $(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -E '^koma-.*\.apk$' || true); do
              gh release delete-asset "$GITHUB_REF_NAME" "$stale" -y
            done
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Koma $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
