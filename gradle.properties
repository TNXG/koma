org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false

# ---- 版本号唯一来源：APK 文件名、versionName 与关于页共用 ----
koma.version=0.0.3

# ---- OHOS spike 开关（验证完成，需要构建鸿蒙产物时改为 true）----
# enableOhos=true 时 core 注册 ohosArm64 target，并切换 Kotlin 系插件到鸿蒙 fork 工具链
# enableOhos=false 时与官方 2.4.21 主线构建完全一致
enableOhos=false
kotlinOhosVersion=2.4.21-0.1.0-13
kotlin.native.distribution.downloadFromMaven=true
